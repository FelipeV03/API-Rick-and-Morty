<!-- LOADER -->
<div *ngIf="loading" class="loader-overlay">
  <mat-progress-spinner mode="indeterminate" diameter="44" color="accent"></mat-progress-spinner>
</div>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="brand">
    <span class="brand-name">Rick <span class="brand-accent">&</span> Morty</span>
    <span class="brand-sub">Character Explorer</span>
  </div>
  <div class="navbar-meta" *ngIf="totalCharacters > 0">
    <span>{{ totalCharacters }} personajes</span>
    <span class="sep">·</span>
    <span>{{ totalPages }} páginas</span>
  </div>
</nav>

<!-- CONTROLES: BÚSQUEDA + FILTROS -->
<div class="controls">
  <div class="search-wrapper">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input class="search-input" type="text" [(ngModel)]="nameSearch"
      (input)="onSearchInput()" placeholder="Buscar personaje...">
    <button *ngIf="nameSearch" class="search-clear" (click)="clearSearch()">✕</button>
  </div>

  <div class="filter-row">
    <span class="filter-label">Estado</span>
    <div class="chips">
      <button class="chip" [class.active]="selectedStatus === 'Alive'" (click)="toggleStatus('Alive')">
        <span class="chip-dot alive"></span>Vivo
      </button>
      <button class="chip" [class.active]="selectedStatus === 'Dead'" (click)="toggleStatus('Dead')">
        <span class="chip-dot dead"></span>Muerto
      </button>
      <button class="chip" [class.active]="selectedStatus === 'unknown'" (click)="toggleStatus('unknown')">
        <span class="chip-dot unknown"></span>Desconocido
      </button>
    </div>
  </div>

  <div class="filter-row">
    <span class="filter-label">Género</span>
    <div class="chips">
      <button class="chip" [class.active]="selectedGender === 'Male'" (click)="toggleGender('Male')">Masculino</button>
      <button class="chip" [class.active]="selectedGender === 'Female'" (click)="toggleGender('Female')">Femenino</button>
      <button class="chip" [class.active]="selectedGender === 'Genderless'" (click)="toggleGender('Genderless')">Sin género</button>
      <button class="chip" [class.active]="selectedGender === 'unknown'" (click)="toggleGender('unknown')">Desconocido</button>
    </div>
  </div>

  <button class="btn-reset" *ngIf="hasActiveFilters" (click)="clearAllFilters()">
    ✕ &nbsp;Limpiar filtros
  </button>
</div>

<!-- INFO DE RESULTADOS -->
<div class="results-info" *ngIf="!loading && totalCharacters > 0">
  {{ totalCharacters }} personajes · Página {{ currentPage }} de {{ totalPages }}
</div>

<!-- GRID DE PERSONAJES -->
<div class="characters-grid" *ngIf="filtrercaracter.length > 0">
  <div class="character-card" *ngFor="let p of filtrercaracter" (click)="selectCharacter(p)">
    <div class="card-image">
      <img [src]="p.image" [alt]="p.name" loading="lazy">
      <div class="card-gradient"></div>

      <button class="fav-btn" [class.active]="isFavorite(p.id)" (click)="toggleFavorite(p, $event)">
        <svg viewBox="0 0 24 24">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>

      <div class="card-info">
        <h3>{{ p.name }}</h3>
        <span class="status-badge">
          <span class="status-dot" [ngClass]="p.status.toLowerCase()"></span>
          {{ p.status }} &nbsp;·&nbsp; {{ p.species }}
        </span>
      </div>
    </div>
  </div>
</div>

<!-- ESTADO VACÍO -->
<div class="empty-state" *ngIf="!loading && filtrercaracter.length === 0">
  <div class="empty-icon">👽</div>
  <p>No se encontraron personajes</p>
  <button *ngIf="hasActiveFilters" (click)="clearAllFilters()">Limpiar filtros</button>
</div>

<!-- PAGINACIÓN -->
<div class="pagination" *ngIf="totalPages > 1 && filtrercaracter.length > 0">
  <button class="page-btn nav" (click)="previousPage()" [disabled]="currentPage === 1">‹</button>

  <ng-container *ngIf="currentPage > 3">
    <button class="page-btn" (click)="loadPage(1)">1</button>
    <span *ngIf="currentPage > 4" class="ellipsis">…</span>
  </ng-container>

  <button class="page-btn" *ngFor="let p of pageNumbers"
    [class.active]="p === currentPage" (click)="loadPage(p)">{{ p }}</button>

  <ng-container *ngIf="currentPage < totalPages - 2">
    <span *ngIf="currentPage < totalPages - 3" class="ellipsis">…</span>
    <button class="page-btn" (click)="loadPage(totalPages)">{{ totalPages }}</button>
  </ng-container>

  <button class="page-btn nav" (click)="nextPage()" [disabled]="currentPage === totalPages">›</button>
</div>

<app-footer></app-footer>
